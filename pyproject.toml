[project]
name = "analyze-grammar-skill"
version = "0.1.0"
description = "Agent Skill for grammar analysis via spaCy"
requires-python = ">=3.14"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "respx>=0.22.0",
  "spacy>=3.8.0",
]
github = ["pytest-github-actions-annotate-failures>=0.3.0"]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.pyrefly]
project-includes = ["scripts/**/*.py", "tests/**/*.py"]
project-excludes = ["**/__pycache__"]
# tests/conftest.py adds this to sys.path at runtime so `analyze_grammar` is
# importable without packaging the standalone script; mirror that for pyrefly.
search-path = ["scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# pydoclint (DOC) rules are preview-only, so they must be selected by exact code
# with preview enabled; explicit-preview-rules keeps other preview rules off
explicit-preview-rules = true
preview = true
select = [
  "A",  # flake8-builtins
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "ASYNC",  # flake8-async
  "B",  # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",  # flake8-comprehensions
  "COM",  # flake8-commas
  "D",  # pydocstyle
  "DOC102",  # pydoclint
  "DOC202",  # pydoclint
  "DOC402",  # pydoclint
  "DOC403",  # pydoclint
  "DOC501",  # pydoclint
  "DOC502",  # pydoclint
  "DTZ",  # flake8-datetimez
  "E",  # pycodestyle errors
  "EM",  # flake8-errmsg
  "F",  # pyflakes
  "FLY",  # flynt
  "FURB",  # refurb
  "G",  # flake8-logging-format
  "I",  # isort
  "ICN",  # flake8-import-conventions
  "INP",  # flake8-no-pep420
  "INT",  # flake8-gettext
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",  # pep8-naming
  "PERF",  # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",  # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",  # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "SLOT",  # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",  # flake8-type-checking
  "TD",  # flake8-todos
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
  "YTT",  # flake8-2020
]
ignore = [
  "E501",  # line too long, handled by ruff-format
  "B008",  # do not perform function calls in argument defaults
  "C901",  # too complex
  "B905",  # `zip()` without an explicit `strict=` parameter
  "COM812",  # missing trailing comma, conflicts with ruff-format
  "RUF001",  # ambiguous unicode characters (incl. lots of math)
  "RUF003",  # -||- but for comments
  "ANN201",  # missing return type annotation for public function
  "PLR0913",  # too many arguments in function/method
  "TD002",  # allow TODO comments w/o author name
  "TD003",  # allow TODO comments w/o issue link
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = [
  "T201",  # `print` used; this is an operator-facing CLI script, not library code
  "INP001",  # implicit namespace package; standalone script, never imported
]
"tests/*.py" = [
  "D",  # test names are self-documenting; a docstring would just repeat them
  "S101",  # `assert` is how pytest tests assert
  "INP001",  # implicit namespace package; test suite, never imported
  "PLR2004",  # magic values (status codes, counts) are clearer inline in a test
]

[tool.ruff.lint.pydocstyle]
convention = "google"
